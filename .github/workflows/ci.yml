name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Refresh lock metadata from pinned package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: One-time lockfile version synchronization
        if: matrix.node == 22 && github.ref == 'refs/heads/feat/wmr-agent-quality-1.1'
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches the manifest."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: synchronize lockfile with application version"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: npm ci --no-audit --no-fund
      - name: Audit dependencies for high and critical advisories
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build:web
      - name: Verify built files and no remote web assets
        run: |
          test -s dist/index.html
          ! grep -Eo '<script[^>]+src="https?://|<link[^>]+href="https?://' dist/index.html
