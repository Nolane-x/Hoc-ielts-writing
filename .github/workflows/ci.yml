name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - name: Upload generated lockfile for reproducible dependency resolution
        uses: actions/upload-artifact@v4
        with:
          name: wmr-package-lock-node-${{ matrix.node }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: One-time lockfile bootstrap for this feature branch
        if: matrix.node == 22 && github.ref == 'refs/heads/feat/wmr-agent-quality-1.1'
        shell: bash
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: pin npm dependency graph with lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Audit dependencies for high and critical advisories
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build:web
      - name: Verify built files and no remote web assets
        run: |
          test -s dist/index.html
          ! grep -Eo '<script[^>]+src="https?://|<link[^>]+href="https?://' dist/index.html
