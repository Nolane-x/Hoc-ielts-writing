name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - name: Audit dependencies for high and critical advisories
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build:web
      - name: Verify built files and no remote web assets
        run: |
          test -s dist/index.html
          ! grep -Eo '<script[^>]+src="https?://|<link[^>]+href="https?://' dist/index.html
      - name: Verify CSP-safe dynamic styling and generated version
        run: |
          ! grep -En '\\.style\\.(color|background|width)|style="width:' web/app.mjs
          ! grep -F '__APP_VERSION__' dist/index.html
          node -e "const p=require('./package.json');const h=require('fs').readFileSync('dist/index.html','utf8');if(!h.includes('WMR Editorial Studio · v'+p.version))process.exit(1)"
