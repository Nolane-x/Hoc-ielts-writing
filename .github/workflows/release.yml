name: Build and Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Required CI (Node 22 and 24)
    uses: ./.github/workflows/ci.yml
  visual-smoke:
    name: Required Chromium desktop/mobile smoke
    uses: ./.github/workflows/visual-smoke.yml
  windows:
    needs: [verify, visual-smoke]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run dist:desktop -- --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: wmr-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
  linux:
    needs: [verify, visual-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run dist:desktop -- --linux AppImage deb --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: wmr-linux
          path: release/*
          if-no-files-found: error
          retention-days: 14
  android:
    needs: [verify, visual-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then echo "ANDROID_HOME/ANDROID_SDK_ROOT is not available on this runner"; exit 1; fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - run: npx cap add android
      - run: npx cap sync android
      - run: node scripts/sync-android-version.mjs
      - name: Build APK and Android App Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Stage platform artifacts with stable names
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/WMR-Android-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/WMR-Android-unsigned.aab
      - uses: actions/upload-artifact@v4
        with:
          name: wmr-android
          path: release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [verify, visual-smoke, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: appmeta
        name: Read application version
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify all platform deliverables are present
        shell: bash
        run: |
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -s release-assets/WMR-Android-debug.apk
          test -s release-assets/WMR-Android-unsigned.aab
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wmr-v${{ steps.appmeta.outputs.version }}-build.${{ github.run_number }}
          name: WMR Writing Mentor v${{ steps.appmeta.outputs.version }} · build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
